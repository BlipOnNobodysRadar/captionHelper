[project]
name = "caption-helper"
version = "0.1.0"
description = "A small local web UI for captioning images and short videos with LM Studio vision models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.3",
    "huggingface-hub>=0.24.0",
    "paddleocr>=3.0.0",
    "requests==2.32.3",
    "opencv-python==4.10.0.84",
    "pillow==10.4.0",
    "torch>=2.3.0",
    "transformers>=4.45.0",
]

[tool.uv]
package = false
